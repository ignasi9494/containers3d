<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Verificador de Modelos 3D - Vila Vila</title>
  <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/4.0.0/model-viewer.min.js"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: system-ui, sans-serif; background: #1a1a2e; color: #eee; padding: 20px; }
    h1 { text-align: center; margin-bottom: 10px; color: #e94560; }
    .status { text-align: center; margin-bottom: 20px; color: #aaa; font-size: 18px; }
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 20px; padding: 10px; }
    .card { background: #16213e; border-radius: 12px; overflow: hidden; border: 2px solid #0f3460; transition: border-color 0.3s; }
    .card.ok { border-color: #4ade80; }
    .card.pending { border-color: #fbbf24; }
    .card h3 { padding: 12px 16px; font-size: 14px; background: #0f3460; display: flex; justify-content: space-between; align-items: center; }
    .badge { font-size: 11px; padding: 2px 8px; border-radius: 10px; font-weight: bold; }
    .badge.ok { background: #4ade80; color: #000; }
    .badge.pending { background: #fbbf24; color: #000; }
    model-viewer { width: 100%; height: 280px; background: #0a0a1a; --poster-color: transparent; }
    .placeholder { height: 280px; display: flex; align-items: center; justify-content: center; color: #555; font-size: 14px; background: #0a0a1a; }
    .placeholder .spinner { width: 30px; height: 30px; border: 3px solid #333; border-top-color: #fbbf24; border-radius: 50%; animation: spin 1s linear infinite; margin-right: 10px; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .info { padding: 8px 16px; font-size: 12px; color: #888; }
    .controls { text-align: center; margin-bottom: 20px; display: flex; gap: 10px; justify-content: center; align-items: center; }
    .btn { padding: 10px 30px; background: #e94560; color: #fff; border: none; border-radius: 8px; font-size: 16px; cursor: pointer; }
    .btn:hover { background: #c73850; }
    .btn.secondary { background: #0f3460; }
    .btn.secondary:hover { background: #1a4a80; }
    .auto-label { color: #888; font-size: 13px; }
  </style>
</head>
<body>
  <h1>Verificador de Modelos 3D</h1>
  <p class="status" id="statusText">Cargando...</p>
  <div class="controls">
    <button class="btn" onclick="refreshStatus()">🔄 Refrescar</button>
    <label class="auto-label">
      <input type="checkbox" id="autoRefresh" checked onchange="toggleAutoRefresh()"> Auto-refresh (20s)
    </label>
  </div>
  <div class="grid" id="grid"></div>

  <script>
    const MODELS = [
      { slug: 'ecopil', name: '1. Ecopil (Piles)' },
      { slug: 'fluorescents', name: '2. Fluorescents' },
      { slug: 'toners', name: '3. Tòners' },
      { slug: 'ibc-1000l', name: '4. IBC 1000L' },
      { slug: 'sac-net', name: '5. Sac Net' },
      { slug: 'big-bag', name: '6. Big Bag' },
      { slug: 'boxs-bateries', name: '7. Boxs Bateries' },
      { slug: 'sacs-fibrociment', name: '8. Sacs Fibrociment' },
      { slug: 'bido-especials', name: '9. Bidons Especials' },
      { slug: 'caixa-perillosos', name: '10. Caixa Perillosos' },
      { slug: 'plastic-240l', name: '11. Plàstic 240L' },
      { slug: 'selectiva-1100l', name: '12. Selectiva 1100L' },
      { slug: 'iglu-vidre', name: '13. Iglú Vidre' },
      { slug: 'skip-2m3', name: '14. Skip 2m³' },
      { slug: 'skip-3m3', name: '15. Skip 3m³' },
      { slug: 'skip-5m3', name: '16. Skip 5m³' },
      { slug: 'skip-6m3-tapat', name: '17. Skip 6m³ Tapat' },
      { slug: 'skip-9m3', name: '18. Skip 9m³' },
      { slug: 'skip-9m3-estanc', name: '19. Skip 9m³ Estanc' },
      { slug: 'rolloff-10-13m3', name: '20. Roll-off 10-13m³' },
      { slug: 'rolloff-12m3', name: '21. Roll-off 12m³' },
      { slug: 'rolloff-15-40m3', name: '22. Roll-off 15-40m³' },
      { slug: 'estancs-15-25m3', name: '23. Estancs 15-25m³' },
      { slug: 'confidencial', name: '24. Confidencial' },
      { slug: 'compactadora', name: '25. Compactadora' },
      { slug: 'autovoltejador', name: '26. Autovoltejador' },
      { slug: 'autobasculant', name: '27. Autobasculant' },
      { slug: 'roll-paker', name: '28. Roll Paker' },
      { slug: 'rotocompactador', name: '29. Rotocompactador' },
      { slug: 'cisterna', name: '30. Cisterna' },
    ];

    // Track which models have been loaded already to avoid re-creating them
    const loadedModels = new Set();
    let autoRefreshTimer = null;

    async function checkModel(slug) {
      try {
        const res = await fetch(`/models/${slug}.glb?t=${Date.now()}`, { method: 'HEAD' });
        return res.ok;
      } catch { return false; }
    }

    // Build the initial grid (only once)
    function buildGrid() {
      const grid = document.getElementById('grid');
      grid.innerHTML = '';
      for (const m of MODELS) {
        const card = document.createElement('div');
        card.className = 'card pending';
        card.id = `card-${m.slug}`;
        card.innerHTML = `
          <h3>
            <span>${m.name}</span>
            <span class="badge pending" id="badge-${m.slug}">Pendiente</span>
          </h3>
          <div class="placeholder" id="viewer-${m.slug}">
            <div class="spinner"></div> Esperando modelo...
          </div>
          <div class="info">${m.slug}.glb</div>
        `;
        grid.appendChild(card);
      }
    }

    // Update status without destroying existing model-viewers
    async function refreshStatus() {
      let ok = 0, pending = 0;

      const checks = await Promise.all(
        MODELS.map(async (m) => ({
          slug: m.slug,
          exists: await checkModel(m.slug)
        }))
      );

      for (const { slug, exists } of checks) {
        const card = document.getElementById(`card-${slug}`);
        const badge = document.getElementById(`badge-${slug}`);
        const viewerContainer = document.getElementById(`viewer-${slug}`);

        if (exists) {
          ok++;
          card.className = 'card ok';
          badge.className = 'badge ok';
          badge.textContent = '✓ OK';

          // Only create model-viewer if not already loaded
          if (!loadedModels.has(slug)) {
            loadedModels.add(slug);
            const mv = document.createElement('model-viewer');
            mv.setAttribute('src', `/models/${slug}.glb?t=${Date.now()}`);
            mv.setAttribute('auto-rotate', '');
            mv.setAttribute('camera-controls', '');
            mv.setAttribute('touch-action', 'pan-y');
            mv.setAttribute('shadow-intensity', '0');
            mv.setAttribute('exposure', '3');
            mv.setAttribute('environment-image', 'neutral');
            mv.setAttribute('tone-mapping', 'commerce');
            mv.setAttribute('camera-orbit', '45deg 55deg auto');
            mv.style.width = '100%';
            mv.style.height = '280px';
            mv.style.background = '#333';
            viewerContainer.replaceWith(mv);
            mv.id = `viewer-${slug}`;
          }
        } else {
          pending++;
        }
      }

      const statusEl = document.getElementById('statusText');
      statusEl.textContent = `${ok} / ${MODELS.length} modelos listos | ${pending} pendientes`;
      if (ok === MODELS.length) {
        statusEl.textContent = `🎉 ¡Todos los ${MODELS.length} modelos generados!`;
        statusEl.style.color = '#4ade80';
        stopAutoRefresh();
      }
    }

    function toggleAutoRefresh() {
      if (document.getElementById('autoRefresh').checked) {
        startAutoRefresh();
      } else {
        stopAutoRefresh();
      }
    }

    function startAutoRefresh() {
      if (autoRefreshTimer) clearInterval(autoRefreshTimer);
      autoRefreshTimer = setInterval(refreshStatus, 20000);
    }

    function stopAutoRefresh() {
      if (autoRefreshTimer) {
        clearInterval(autoRefreshTimer);
        autoRefreshTimer = null;
      }
      document.getElementById('autoRefresh').checked = false;
    }

    // Initialize
    buildGrid();
    refreshStatus();
    startAutoRefresh();
  </script>
</body>
</html>
